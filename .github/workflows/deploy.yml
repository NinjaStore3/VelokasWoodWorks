name: Test and deploy

# Tests every pull request and push. Pushes to main (and manual runs) then
# deploy to Cloudflare. Needs these repository secrets
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" + Account · D1 · Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   ADMIN_PASSWORD         password for the Settings tab (optional once set)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings → Secrets and variables → Actions), then re-run this workflow."
            exit 1
          fi

      # The first deploy also creates the "velokas-db" D1 database.
      - name: Deploy the Worker
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          args=()
          if [ -n "$ADMIN_PASSWORD" ]; then
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ ADMIN_PASSWORD: process.env.ADMIN_PASSWORD }))' "$RUNNER_TEMP/secrets.json"
            args=(--secrets-file "$RUNNER_TEMP/secrets.json")
          fi
          npx wrangler deploy "${args[@]}" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          if [ -n "$url" ]; then
            echo "### The app is live: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
