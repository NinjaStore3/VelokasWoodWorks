<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E452A"/>
      <stop offset=".55" stop-color="#3B2416"/>
      <stop offset="1" stop-color="#1E120B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".08" r=".85">
      <stop offset="0" stop-color="#FFD58A" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#FFD58A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plank-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE0A0"/>
      <stop offset=".5" stop-color="#F5B84E"/>
      <stop offset="1" stop-color="#DD8C2C"/>
    </linearGradient>
    <linearGradient id="plank-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9C46A"/>
      <stop offset=".55" stop-color="#EF9636"/>
      <stop offset="1" stop-color="#C96A1E"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <g fill="none" stroke="#FFD58A" stroke-opacity=".09" stroke-width="3">
      <path d="M-20 70 C 110 40 250 110 540 64"/>
      <path d="M-20 118 C 140 92 300 150 540 110"/>
      <path d="M-20 430 C 130 400 300 470 540 420"/>
      <path d="M-20 474 C 150 450 310 500 540 468"/>
    </g>

    <!-- Left plank -->
    <g transform="translate(204 258) rotate(-21)">
      <rect x="-46" y="-168" width="92" height="336" rx="22" fill="url(#plank-left)"/>
      <g fill="none" stroke="#A95E1C" stroke-opacity=".35" stroke-width="5" stroke-linecap="round">
        <path d="M-20 -150 C -8 -70 -30 10 -14 150"/>
        <path d="M14 -150 C 26 -90 4 -10 20 150"/>
      </g>
    </g>

    <!-- Shadow where the right plank crosses the left one -->
    <g transform="translate(314 266) rotate(21)" opacity=".35">
      <rect x="-46" y="-168" width="92" height="336" rx="22" fill="#2A160A"/>
    </g>

    <!-- Right plank -->
    <g transform="translate(308 258) rotate(21)">
      <rect x="-46" y="-168" width="92" height="336" rx="22" fill="url(#plank-right)"/>
      <g fill="none" stroke="#9A4F14" stroke-opacity=".35" stroke-width="5" stroke-linecap="round">
        <path d="M-18 -150 C -4 -80 -26 0 -12 150"/>
        <path d="M16 -150 C 28 -70 6 10 22 150"/>
      </g>
    </g>
  </g>
</svg>
